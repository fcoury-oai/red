name: Verify Windows distribution packages
on:
  push:
    branches: [verify-red-packages-0.11.1]
permissions:
  contents: read
jobs:
  winget:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Install current WinGet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/microsoft/winget-cli/releases/download/v1.29.380'
          $work = Join-Path $env:RUNNER_TEMP 'winget-release'
          New-Item -ItemType Directory -Path $work | Out-Null
          Invoke-WebRequest "$base/DesktopAppInstaller_Dependencies.zip" -OutFile "$work/deps.zip"
          Expand-Archive "$work/deps.zip" "$work/deps"
          $deps = @(Get-ChildItem "$work/deps" -Recurse -File -Include *.appx,*.msix | Where-Object FullName -match '[\\/]x64[\\/]')
          foreach ($dep in $deps) { Add-AppxPackage -Path $dep.FullName -ForceUpdateFromAnyVersion }
          Invoke-WebRequest "$base/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle" -OutFile "$work/winget.msixbundle"
          Add-AppxPackage -Path "$work/winget.msixbundle" -ForceApplicationShutdown -ForceUpdateFromAnyVersion
          $install = (Get-AppxPackage Microsoft.DesktopAppInstaller).InstallLocation
          $install | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$install/winget.exe" --info
      - name: Install, run, and uninstall Red
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          winget validate --manifest verify/winget
          winget settings --enable LocalManifestFiles
          winget install --manifest verify/winget --scope user --accept-package-agreements --accept-source-agreements --disable-interactivity
          $red = "$env:LOCALAPPDATA\Microsoft\WinGet\Links\red-editor.exe"
          if ((& $red --version) -ne 'red 0.11.1') { throw 'Unexpected version' }
          $result = & $red --self-check
          if ($result[-1] -ne 'red self-check ok') { throw 'Red self-check failed' }
          Write-Output $result[-1]
          winget source remove --name msstore
          winget uninstall --id Codersauce.Red --exact --disable-interactivity
  scoop:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Install, run, and uninstall Red
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          irm https://get.scoop.sh -OutFile "$env:RUNNER_TEMP\scoop-install.ps1"
          & "$env:RUNNER_TEMP\scoop-install.ps1" -RunAsAdmin
          $env:Path = "$env:USERPROFILE\scoop\shims;$env:Path"
          scoop install .\bucket\red-editor.json
          if ($LASTEXITCODE -ne 0) { throw 'Scoop installation failed' }
          if ((red-editor --version) -ne 'red 0.11.1') { throw 'Unexpected version' }
          $result = red-editor --self-check
          if ($LASTEXITCODE -ne 0 -or $result[-1] -ne 'red self-check ok') { throw 'Red self-check failed' }
          Write-Output $result[-1]
          scoop uninstall red-editor
